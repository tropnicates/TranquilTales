name: Release final

on:
  push:
    branches:
      - release-final
  pull_request:
    branches:
      - release-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Check backend JavaScript syntax
        run: |
          node --check server.js
          find config controllers middlewares models routes utils -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  deploy:
    name: Deploy to Render
    needs: validate
    if: github.ref == 'refs/heads/release-final' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Set the RENDER_DEPLOY_HOOK_URL repository secret to enable deployments."
            exit 0
          fi
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
